<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web với màu nền và ảnh nền</title>
    <!-- Liên kết tới file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả trang web -->
    <p class="intro">
        Trang web này được xây dựng để luyện tập cách phối hợp giữa màu nền (background-color) và hình nền (background-image) trong thiết kế giao diện web.
    </p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền -->
    <div class="banner-box">
        <div class="overlay">
            <h2>Nội dung quan trọng</h2>
            <p>Học lập trình web mỗi ngày mở ra cơ hội xây dựng những ứng dụng sáng tạo và hữu ích.</p>
        </div>
    </div>

</body>
</html>
